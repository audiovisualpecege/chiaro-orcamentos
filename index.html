<style>
/* Chiaro Orçamentos — identidade baseada em chiarofilmes.com */
:root {
  --bg: #18181b;
  --surface: #26272b;
  --surface-2: #2f3035;
  --surface-3: #383940;
  --line: rgba(238, 242, 246, 0.1);
  --line-strong: rgba(238, 242, 246, 0.18);
  --text: #ffffff;
  --muted: rgba(255, 255, 255, 0.64);
  --faint: rgba(255, 255, 255, 0.4);
  --accent: #9155dd;
  --accent-hover: #a36ce6;
  --accent-deep: #6934a4;
  --accent-light: #ca9af4;
  --accent-soft: rgba(145, 85, 221, 0.16);
  --ok: #4ade80;
  --ok-soft: rgba(74, 222, 128, 0.14);
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, 0.14);
  --bad: #f87171;
  --bad-soft: rgba(248, 113, 113, 0.14);
  --info: #7cb4ff;
  --info-soft: rgba(124, 180, 255, 0.14);
  --etapa-pre: #7cb4ff;
  --etapa-prod: #ca9af4;
  --etapa-pos: #4ade80;
  --radius: 6px;
  --font: 'Archivo', 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-light); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 26px; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }

/* ---------- layout ---------- */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 4px;
  padding: 24px 14px;
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(145, 85, 221, 0.06), transparent 40%);
}
.sidebar .logo { display: block; padding: 0 10px 22px; }
.sidebar .logo img { width: 118px; display: block; }
.sidebar .logo span { display: block; margin-top: 8px; font-size: 11px; letter-spacing: 0.32em; color: var(--muted); text-transform: uppercase; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: var(--radius);
  color: var(--muted); font-weight: 500;
}
.nav a:hover { background: var(--surface); color: var(--text); text-decoration: none; }
.nav a.ativo { background: var(--accent-soft); color: var(--text); }
.nav a.ativo svg { color: var(--accent-light); }
.nav svg { width: 18px; height: 18px; flex: none; }
.sidebar .rodape { margin-top: auto; padding: 10px; font-size: 11px; color: var(--faint); }

.main { min-width: 0; padding: 28px 32px 60px; }
.topo { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.topo .sub { color: var(--muted); margin-top: 4px; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.nav a.atualizar { margin-top: 10px; border-top: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); padding-top: 13px; }
.girando svg { animation: gira 0.8s linear infinite; }

/* ---------- componentes ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
}
.card + .card { margin-top: 16px; }
.card-titulo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-titulo h2 { display: flex; align-items: center; gap: 8px; }
.card-titulo h2 svg { width: 18px; height: 18px; color: var(--accent-light); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 36px; padding: 0 14px;
  border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: transparent; color: var(--text);
  font: 500 13px var(--font); cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 16px; height: 16px; }
.btn.primario { background: var(--accent); border-color: var(--accent); }
.btn.primario:hover { background: var(--accent-hover); }
.btn.ia { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); border-color: transparent; }
.btn.ia:hover { filter: brightness(1.12); }
.btn.perigo { color: var(--bad); }
.btn.perigo:hover { background: var(--bad-soft); }
.btn.fantasma { border-color: transparent; color: var(--muted); }
.btn.fantasma:hover { color: var(--text); }
.btn.mini { height: 28px; padding: 0 9px; font-size: 12px; }
.btn.icone { width: 32px; padding: 0; height: 32px; }
.btn:disabled { opacity: 0.5; cursor: default; }

label.campo { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); min-width: 0; }
input, select, textarea {
  width: 100%;
  background: var(--bg); color: var(--text);
  border: 1px solid var(--line-strong); border-radius: var(--radius);
  padding: 8px 10px; font: 14px var(--font);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
input[type=number] { font-variant-numeric: tabular-nums; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
select option { background: var(--surface); }

.grade { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.span-all { grid-column: 1 / -1; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 999px;
  background: var(--surface-3); color: var(--muted);
  font-size: 12px; font-weight: 500; white-space: nowrap;
}
.chip.roxo { background: var(--accent-soft); color: var(--accent-light); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip button { all: unset; cursor: pointer; opacity: 0.7; }
.chip button:hover { opacity: 1; }

.etapa { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 4px; }
.etapa.pre { color: var(--etapa-pre); background: var(--info-soft); }
.etapa.prod { color: var(--etapa-prod); background: var(--accent-soft); }
.etapa.pos { color: var(--etapa-pos); background: var(--ok-soft); }

.vazio { text-align: center; padding: 36px 16px; color: var(--muted); }
.vazio svg { width: 34px; height: 34px; color: var(--faint); margin-bottom: 8px; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.stat .rot { font-size: 12px; color: var(--muted); }
.stat .val { font-size: 22px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat .val.roxo { color: var(--accent-light); }

/* ---------- kanban ---------- */
.filtros { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.filtros input[type=search] { max-width: 300px; }
.segmentado { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
.segmentado button { all: unset; cursor: pointer; padding: 7px 12px; font-size: 13px; color: var(--muted); }
.segmentado button.ativo { background: var(--accent-soft); color: var(--text); }
.kanban { display: grid; grid-template-columns: repeat(5, minmax(210px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.coluna { background: rgba(38, 39, 43, 0.5); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; min-height: 300px; }
.coluna.sobre { border-color: var(--accent); background: var(--accent-soft); }
.coluna-topo { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 10px; font-size: 13px; font-weight: 600; }
.coluna-topo .soma { font-weight: 400; color: var(--muted); font-size: 12px; }
.bolinha { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 7px; }
.cartao {
  display: block; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; margin-bottom: 8px; cursor: pointer; color: var(--text);
}
.cartao:hover { border-color: var(--line-strong); text-decoration: none; background: var(--surface-2); }
.cartao .n { font-size: 11px; color: var(--faint); letter-spacing: 0.04em; }
.cartao .t { font-weight: 600; margin: 2px 0; line-height: 1.3; }
.cartao .c { font-size: 12px; color: var(--muted); }
.cartao .rod { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; }
.cartao .v { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- tabelas ---------- */
.tabela { width: 100%; border-collapse: collapse; }
.tabela th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tabela td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tabela tr.clicavel { cursor: pointer; }
.tabela tr.clicavel:hover td { background: var(--surface-2); }
.tabela .grupo td { background: var(--bg); font-weight: 600; font-size: 12px; letter-spacing: 0.06em; padding-top: 16px; }

/* ---------- editor ---------- */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.lateral { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 16px; }
.salvo { font-size: 12px; color: var(--faint); }
.titulo-editavel { background: transparent; border: 1px solid transparent; font: 600 24px var(--font); padding: 2px 6px; margin-left: -7px; }
.titulo-editavel:hover { border-color: var(--line); }

.itens { display: flex; flex-direction: column; gap: 8px; }
.item { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
.item.aberto { border-color: var(--line-strong); }
.item-linha { display: grid; grid-template-columns: minmax(0, 1fr) 56px repeat(3, 84px) 88px 60px; gap: 8px; align-items: center; padding: 10px 12px; }
.item-nome { min-width: 0; }
.item-nome .t { font-weight: 600; line-height: 1.3; display: flex; gap: 8px; align-items: center; }
.item-nome .t span.nm { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.item-nome .o { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.item-nome input.nome-livre { font-weight: 600; padding: 4px 6px; }
.ph { display: flex; align-items: center; gap: 2px; }
.ph input { padding: 5px 2px; min-width: 0; text-align: center; font-size: 13px; }
.ph span { color: var(--faint); font-size: 11px; }
.ph.zero input { color: var(--faint); }
.item-linha .qtd input { text-align: center; padding: 6px 4px; }
.item-total { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.item-acoes { display: flex; justify-content: flex-end; gap: 2px; }
.item-cab { display: grid; grid-template-columns: minmax(0, 1fr) 56px repeat(3, 84px) 88px 60px; gap: 8px; padding: 0 12px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.item-cab > div:nth-child(n+2) { text-align: center; }
.item-cab > div:nth-child(6) { text-align: right; }
.item-detalhe { border-top: 1px dashed var(--line); padding: 14px 12px; display: grid; gap: 14px; }
.quebra { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.quebra b { color: var(--text); font-weight: 600; }
.alocacoes { display: flex; flex-direction: column; gap: 6px; }
.alocacao { display: grid; grid-template-columns: minmax(0, 1fr) 120px 90px 110px 32px; gap: 8px; align-items: center; }
.alocacao select, .alocacao input { padding: 6px 8px; font-size: 13px; }
.escala { display: grid; grid-template-columns: minmax(0, 1fr) 150px 130px 76px 110px 32px; gap: 8px; align-items: center; padding: 6px 0; }
.escala select, .escala input { padding: 6px 8px; font-size: 13px; }
.adicionar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

.resumo-linha { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-variant-numeric: tabular-nums; }
.resumo-linha.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; font-size: 15px; font-weight: 600; }
.resumo-linha.final { font-size: 22px; font-weight: 700; color: var(--accent-light); }
.barra { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; display: flex; margin: 6px 0 12px; }
.barra i { display: block; height: 100%; }
.descontos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
.descontos button { all: unset; cursor: pointer; text-align: center; padding: 8px 4px; border: 1px solid var(--line-strong); border-radius: var(--radius); font-size: 13px; }
.descontos button.ativo { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.descontos input { padding: 7px 4px; text-align: center; }

/* ---------- IA ---------- */
.ia-painel { border: 1px solid rgba(145, 85, 221, 0.4); background: linear-gradient(180deg, rgba(145, 85, 221, 0.1), transparent 70%); }
.ia-resultado { margin-top: 16px; display: grid; gap: 14px; }
.ia-item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
.ia-item .j { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ia-lista { margin: 0; padding-left: 18px; color: var(--muted); }
.ia-lista li { margin: 3px 0; }
.carregando { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: #fff; border-radius: 50%; animation: gira 0.8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }

/* ---------- pessoas ---------- */
.pessoas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.pessoa { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
.pessoa:hover { border-color: var(--line-strong); background: var(--surface-2); }
.pessoa.inativa { opacity: 0.5; }
.pessoa-topo { display: flex; gap: 12px; align-items: center; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--accent-soft); color: var(--accent-light); flex: none; }
.avatar.freela { background: var(--warn-soft); color: var(--warn); }
.tags { display: flex; gap: 5px; flex-wrap: wrap; }
.estrelas { color: var(--warn); letter-spacing: 1px; }
.contatos { display: flex; gap: 12px; font-size: 12px; }

/* ---------- modal ---------- */
.modal-fundo { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; width: min(720px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
.modal.largo { width: min(920px, 100%); }
.modal-topo { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-corpo { padding: 20px; overflow: auto; }
.modal-rodape { display: flex; justify-content: space-between; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
.picker-lista { display: flex; flex-direction: column; gap: 6px; max-height: 55vh; overflow: auto; margin-top: 12px; }
.picker-item { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.picker-item:hover { border-color: var(--accent); background: var(--accent-soft); }

.toast { position: fixed; bottom: 22px; right: 22px; background: var(--surface-3); border: 1px solid var(--line-strong); border-left: 3px solid var(--accent); padding: 12px 16px; border-radius: var(--radius); z-index: 60; max-width: 420px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
.toast.erro { border-left-color: var(--bad); }

.aviso { padding: 12px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.aviso.info { background: var(--info-soft); color: var(--info); }
.passos { margin: 6px 0 0; padding-left: 18px; }
.passos li { margin: 4px 0; }
code { background: var(--bg); padding: 1px 6px; border-radius: 4px; font-size: 12px; }

/* ---------- dashboard ---------- */
:root {
  /* séries: paleta categórica validada (modo escuro) + cor única da marca */
  --serie-1: #3987e5;
  --serie-3: #199e70;
  --serie-u: #a36ce6;
  --grade: rgba(255, 255, 255, 0.07);
  --eixo: rgba(255, 255, 255, 0.18);
}
.dash { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.dash .card + .card { margin-top: 0; }
.span-dash { grid-column: 1 / -1; }
.grafico { width: 100%; height: auto; display: block; overflow: visible; }
.grafico .grade { stroke: var(--grade); stroke-width: 1; }
.grafico .eixo-base { stroke: var(--eixo); stroke-width: 1; }
.grafico text { font: 11px var(--font); fill: var(--muted); }
.grafico text.val { fill: var(--text); font-weight: 600; }
.grafico .col:hover path { filter: brightness(1.2); }
.legenda { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.bh { display: flex; flex-direction: column; gap: 4px; }
.bh-linha { display: grid; grid-template-columns: minmax(90px, 34%) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 4px 6px; border-radius: 4px; color: var(--text); }
a.bh-linha:hover, .bh-linha:hover { background: var(--surface-2); text-decoration: none; }
.bh-rot { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bh-trilho { display: block; height: 10px; background: var(--grade); border-radius: 0 4px 4px 0; overflow: hidden; }
.bh-trilho i { display: block; height: 100%; background: var(--serie-u); border-radius: 0 4px 4px 0; }
.bh-val { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini { display: grid; grid-template-columns: minmax(60px, 1fr) auto; gap: 8px; align-items: center; }

          <h1>Confira seu e-mail</h1>
          <form id="f-codigo" class="login-form">
            <p class="muted">Mandamos um código para <b>${esc(email)}</b>. Ele vale por 10 minutos. Se não chegar, olhe a caixa de spam.</p>
            <label class="campo">Código<input id="l-codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required placeholder="000000" class="login-codigo"></label>
            <button class="btn primario" id="l-entrar" type="submit">Entrar</button>
            <div class="login-links"><button type="button" class="btn fantasma mini" id="l-trocar">Usar outro e-mail</button>
              <button type="button" class="btn fantasma mini" id="l-reenviar">Mandar outro código</button></div>
            <div class="login-erro" id="l-erro">${esc(msg)}</div>
          </form>
        </div>`;
      alvo.querySelector('#l-codigo').focus();
      alvo.querySelector('#l-trocar').onclick = () => passoEmail();
      alvo.querySelector('#l-reenviar').onclick = async () => {
        try { const r = await rpc('pedirCodigo', email); if (!r.ok) throw new Error(r.erro); passoCodigo(r.aviso || 'Código novo enviado.'); } catch (err) { alvo.querySelector('#l-erro').textContent = err.message; }
      };
      alvo.querySelector('#f-codigo').onsubmit = async (e) => {
        e.preventDefault();
        const b = alvo.querySelector('#l-entrar');
        b.disabled = true; b.textContent = 'Entrando…';
        try {
          const r = await rpc('entrar', email, alvo.querySelector('#l-codigo').value);
          if (!r.ok) throw new Error(r.erro);
          guardarToken(r.token);
          sessao.usuario = r.usuario;
          pronto(r.usuario);
        } catch (err) {
          alvo.querySelector('#l-erro').textContent = err.message;
          b.disabled = false; b.textContent = 'Entrar';
        }
      };
    };
    passoEmail();
  });
}

const CSS = `
  body { background: #2a2a2f; }
  .pc-barra { position: sticky; top: 0; z-index: 10; display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; padding: 10px 20px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .pc-barra .dica { color: var(--muted); font-size: 12px; }
  .pc-barra label { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  .pc-barra .grupo { display: flex; gap: 6px; align-items: center; padding-left: 10px; border-left: 1px solid var(--line); }
  .pc-barra .grupo select { width: auto; padding: 6px 8px; }
  .pc-barra .ferr { min-width: 34px; padding: 6px 9px; }
  .pc-barra .ferr:disabled, .pc-barra select:disabled { opacity: .35; }
  .pc-pend { background: #fbbf24; color: #1d1d22; font: 600 12px var(--font); padding: 5px 9px; border-radius: 5px; }
  .pc-palco { padding: 28px 16px 60px; }
  .pc-doc { width: 210mm; margin: 0 auto; counter-reset: secao; }
  .pc-folha { position: relative; width: 210mm; height: 297mm; box-sizing: border-box; margin: 0 auto 26px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.35); font-family: 'Archivo', Arial, sans-serif; }

  /* capa — gradiente em vetor, logo SVG e texto real */
  .pc-capa { background:
      radial-gradient(34% 21% at 39% 100%, rgba(67,52,114,1) 0%, rgba(55,41,97,.75) 38%, rgba(30,16,64,0) 100%),
      radial-gradient(70% 18% at 40% 100%, rgba(43,30,82,.9) 0%, rgba(30,16,64,0) 100%),
      linear-gradient(180deg, #42346f 0%, #403170 12%, #3a2c67 21%, #33255e 31%, #2b1c51 41%, #231447 51%, #1f1042 61%, #1d0f3f 71%, #1c0e3c 84%, #190b37 100%); }
  .pc-marca { position: absolute; top: 20.2mm; left: 133mm; display: flex; align-items: center; }
  .pc-marca img { height: 16.2mm; display: block; }
  .pc-marca span { margin-left: 1.3mm; font: 400 5.25mm/1 'Montserrat', Arial, sans-serif; letter-spacing: .055em; color: #ededf0; }
  .pc-capa h1 { position: absolute; left: 27mm; top: 124.6mm; margin: 0; font: 600 23.7mm/0.85 'Archivo', Arial, sans-serif; letter-spacing: -.012em; color: #efefef; }
  .pc-capa h1 span { display: block; }
  .pc-capa h1 .roxo { color: #7c50d5; padding-left: 45.6mm; }

  /* páginas de texto */
  .pc-texto { background: linear-gradient(180deg, #dadada 0%, #e1e1e1 55%, #e4e4e4 100%); color: #121212; }
  .pc-corpo { position: absolute; left: 15.8mm; right: 16.5mm; top: 20.5mm; bottom: 13mm; overflow: hidden; font-size: 12pt; line-height: 1.72; }
  .b { outline: none; border-radius: 3px; overflow-wrap: break-word; }
  .b-saudacao { font-size: 15.6pt; font-weight: 700; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; margin: 0 0 2.2mm; }
  .b-p { margin: 0 0 2.4mm; }
  .b-titulo { font-size: 15.6pt; font-weight: 700; line-height: 1.35; margin: 5.2mm 0 3.6mm; }
  .b-secao { font-size: 13.3pt; font-weight: 600; line-height: 1.4; margin: 4.6mm 0 2.4mm; }
  .b-secao::before { counter-increment: secao; content: counter(secao) '. '; }
  .b-item { margin: 0 0 1.5mm 6.3mm; }
  .b-item::before { content: '• '; }
  .b b, .b strong { font-weight: 700; }

        ${s.perguntas?.length ? `<div><h3>Perguntar ao cliente</h3><ul class="ia-lista">${s.perguntas.map((p) => `<li>${esc(p)}</li>`).join('')}</ul></div>` : ''}
        ${s.alertas?.length ? `<div class="aviso">${s.alertas.map(esc).join('<br>')}</div>` : ''}
        <div class="acoes">
          ${s.aplicada ? '' : `<button class="btn primario" data-acao="aplicar">${icone('mais')}Adicionar selecionados ao orçamento</button>`}
          <button class="btn fantasma" data-acao="descartar">Descartar sugestão</button>
        </div>
      </div>`;
  };

  const equipeHTML = (t) => {
    const necessarias = funcoesNecessarias();
    const cobertas = new Set(orc.equipe.map((a) => a.funcao));
    const chips = necessarias.map(([f]) => cobertas.has(f)
      ? `<span class="chip ok">✓ ${esc(f)}</span>`
      : `<button class="chip warn" style="border:0;cursor:pointer" data-acao="escalar" data-funcao="${esc(f)}">+ ${esc(f)}</button>`).join(' ');
    const linhas = orc.equipe.map((a) => {
      const interno = a.pessoa_id === INTERNO;
      const p = interno ? null : db.pessoas.find((x) => x.id === a.pessoa_id);
      const conf = p ? conflitos(p.id, orc) : [];
      const funcs = [...new Set([a.funcao, ...(p?.funcoes || [])].filter(Boolean))];
      const nome = interno ? 'Equipe Chiaro' : (p?.nome || 'Pessoa removida');
      const sub = interno
        ? (num(cfg.custo_hora_equipe) ? `interna · ${brl(cfg.custo_hora_equipe)}/h` : 'interna · defina o custo-hora em Configurações')
        : `Freela${p && rotuloPessoa(p) ? ' · ' + rotuloPessoa(p) : ''}`;
      return `
        <div class="escala">
          <div style="min-width:0">
            <div style="display:flex;gap:8px;align-items:center"><div class="avatar ${interno ? '' : 'freela'}" style="width:30px;height:30px;font-size:11px">${interno ? 'CF' : esc(iniciais(p?.nome))}</div>
              <div style="min-width:0"><b>${esc(nome)}</b><div class="small muted">${esc(sub)}</div></div></div>
            ${conf.length ? `<div class="chip bad" style="margin-top:6px" title="Mesma data em outro orçamento">Ocupado: ${esc(conf.map((o) => o.projeto || o.numero).join(', '))}</div>` : ''}
          </div>
          ${interno
            ? `<input data-eq="${a.uid}" data-f="funcao" list="lista-funcoes-eq" value="${esc(a.funcao)}" placeholder="Função">`
            : `<select data-eq="${a.uid}" data-f="funcao">${funcs.map((f) => `<option ${f === a.funcao ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select>`}
          <select data-eq="${a.uid}" data-f="etapa">${ETAPAS.map((e) => `<option value="${e.chave}" ${a.etapa === e.chave ? 'selected' : ''}>${e.nome}</option>`).join('')}</select>
          <input type="number" min="0" step="0.5" data-eq="${a.uid}" data-f="horas" value="${num(a.horas)}" title="Horas">
          <input type="number" min="0" data-eq="${a.uid}" data-f="valor" value="${num(a.valor) || ''}" placeholder="${brl(custoAlocacao({ ...a, valor: '' }, db.pessoas, cfg))}" title="Cachê combinado (deixe vazio para calcular por hora)">
          <button class="btn icone fantasma" data-acao="tirar" data-uid="${a.uid}" title="Remover">${icone('x')}</button>
        </div>`;
    }).join('') + `<datalist id="lista-funcoes-eq">${todasFuncoes().map((f) => `<option value="${esc(f)}">`).join('')}</datalist>`;
    return `
      <div class="card">
        <div class="card-titulo"><h2>${icone('pessoas')}Equipe escalada</h2><button class="btn" data-acao="escalar">${icone('mais')}Escalar equipe</button></div>
        ${necessarias.length ? `<div class="small muted" style="margin-bottom:8px">Funções que este job pede:</div><div class="tags" style="margin-bottom:14px">${chips}</div>` : ''}
        ${orc.equipe.length ? `
          <div class="escala small faint" style="font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding-bottom:0"><div>Pessoa</div><div>Função</div><div>Etapa</div><div>Horas</div><div>Cachê</div><div></div></div>
          <div class="alocacoes">${linhas}</div>
          <div class="resumo-linha" style="margin-top:8px"><span class="muted">Custo estimado da equipe</span><b id="eq-total">${brl(t.custoEquipe)}</b></div>`
        : `<p class="muted" style="margin:0">Ninguém escalado ainda. Use o botão acima para adicionar horas da equipe Chiaro ou escolher freelas do banco.</p>`}
      </div>`;
  };

  const lateralHTML = (t) => {
    const rapidos = cfg.descontos_rapidos || [0, 10, 20];
    const noRapido = rapidos.includes(num(orc.desconto));
    const partes = ETAPAS.map((e) => ({ ...e, v: t[e.chave] })).concat([{ chave: 'log', nome: 'Logística + extra', cor: 'var(--warn)', v: t.log }]);
    return `
      <div class="card">
        <h3>Resumo</h3>
        <div class="barra" id="r-barra"></div>
        ${partes.map((p) => `<div class="resumo-linha"><span><i class="bolinha" style="background:${p.cor}"></i>${p.nome}</span><span id="r-${p.chave}">${brl(p.v)}</span></div>`).join('')}
        <div class="resumo-linha total"><span>Total sem desconto</span><span id="r-total">${brl(t.total)}</span></div>
        <div class="small muted" style="margin-top:12px">Desconto</div>
        <div class="descontos" style="grid-template-columns:repeat(${rapidos.length + 1},1fr)">
          ${rapidos.map((d) => `<button data-acao="desc" data-v="${d}" class="${num(orc.desconto) === d ? 'ativo' : ''}">${d ? d + '%' : 'Sem'}</button>`).join('')}
          <input type="number" min="0" max="100" step="1" data-orc="desconto" id="r-desc" placeholder="Outro %" value="${noRapido ? '' : num(orc.desconto)}">
        </div>
        <div class="resumo-linha"><span class="muted">Economia do cliente</span><span id="r-eco">${brl(t.economia)}</span></div>
        <div class="resumo-linha final"><span>Valor final</span><span id="r-final">${brl(t.final)}</span></div>
        <div class="resumo-linha total" style="font-size:13px;font-weight:500"><span class="muted">Custo da equipe escalada</span><span id="r-custo">${brl(t.custoEquipe)}</span></div>
        <div class="resumo-linha" style="font-size:13px"><span class="muted">Resultado estimado</span><span id="r-res"></span></div>
      </div>
      <div class="card">
        <h3 style="margin-bottom:12px">Parâmetros deste orçamento</h3>
        <div class="grade g3">
          <label class="campo">Hora R$<input type="number" min="0" data-orc="taxa_hora" value="${num(orc.taxa_hora)}"></label>
          <label class="campo">Margem %<input type="number" min="0" data-orc="margem" value="${num(orc.margem)}"></label>
          <label class="campo">Deprec. %<input type="number" min="0" step="0.5" data-orc="dep_global" value="${num(orc.dep_global)}"></label>
        </div>
        <p class="small faint" style="margin:10px 0 0">Copiados das Configurações quando o orçamento foi criado. Alterar aqui muda só este orçamento.</p>
      </div>
      <div class="card">
        <div class="grade">
          <button class="btn primario" data-acao="comercial">${icone('arquivo')}Proposta comercial</button>
          <button class="btn" data-acao="proposta">${icone('impressora')}Orçamento detalhado (PDF)</button>
          <button class="btn" data-acao="duplicar">${icone('copiar')}Duplicar orçamento</button>
          <button class="btn perigo" data-acao="excluir">${icone('lixo')}Excluir</button>
        </div>
      </div>`;
  };

  // ---------------------------------------------------------- render
  const render = () => {
    orc.itens.sort((a, b) => (ORDEM[a.etapa] ?? 9) - (ORDEM[b.etapa] ?? 9));
    const t = calcOrcamento(orc, cfg, db.pessoas);
    const tipos = [...new Set([...TIPOS_PADRAO, ...db.orcamentos.map((o) => o.tipo_servico).filter(Boolean)])];
    const iaConfigurada = cfg.ia?.chave || cfg.ia?.provedor !== 'gemini';
    el.innerHTML = `
      <div class="topo">
        <div style="min-width:0;flex:1">
          <a href="#/" class="muted small" style="display:inline-flex;align-items:center;gap:4px"><span style="width:14px;display:inline-flex">${icone('voltar')}</span>Orçamentos</a>
          <div style="display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap">
            <span class="chip roxo">${esc(orc.numero)}</span>
            <input class="titulo-editavel" data-orc="projeto" value="${esc(orc.projeto)}" placeholder="Nome do projeto" style="flex:1;min-width:240px">
          </div>
        </div>
        <div class="acoes">
          <span class="salvo" id="salvo">${esc(estado)}</span>
          <select data-orc="status" style="width:auto">${(cfg.status || []).map((s) => `<option ${orc.status === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
          ${orc.status === 'Perdido' ? `<select data-orc="motivo_perda" style="width:auto" title="Motivo da perda"><option value="">Motivo…</option>${(cfg.motivos_perda || []).map((m) => `<option ${orc.motivo_perda === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>` : ''}
          <button class="btn" data-acao="salvar" title="Salva agora (o sistema também salva sozinho enquanto você edita)">${icone('salvar')}Salvar</button>
          ${proximaEtapa(orc.status, cfg.status) ? `<button class="btn primario" data-acao="avancar" title="Salva e passa o orçamento para a próxima coluna do kanban">${icone('avancar')}Salvar e avançar para ${esc(proximaEtapa(orc.status, cfg.status))}</button>` : ''}
        </div>
      </div>
      <div class="editor">
        <div>
          <div class="card">
            <div class="grade g4">
              <label class="campo span2">Cliente${orc.cliente_id ? ` <a href="#/clientes/${orc.cliente_id}" class="small">ver ficha</a>` : ''}<input data-orc="cliente" list="lista-clientes" value="${esc(orc.cliente)}" placeholder="Comece a digitar — puxa da base de clientes"></label>
              <label class="campo span2">Contato do cliente<input data-orc="contato_cliente" value="${esc(orc.contato_cliente)}" placeholder="Nome, e-mail ou telefone"></label>
              <label class="campo">Tipo de serviço<input data-orc="tipo_servico" list="tipos" value="${esc(orc.tipo_servico)}"></label>
              <label class="campo">Data do job<input type="date" data-orc="data_evento" value="${esc(orc.data_evento)}"></label>
              <label class="campo">Local / cidade<input data-orc="local" value="${esc(orc.local)}"></label>
              <label class="campo">Responsável${responsaveis.length ? `
                <select data-resp>
                  <option value="">Selecione…</option>
                  ${responsaveis.map((n) => `<option ${!digitarResp && n === orc.responsavel ? 'selected' : ''}>${esc(n)}</option>`).join('')}
                  <option value="__outro" ${digitarResp ? 'selected' : ''}>Outro (digitar)…</option>
                </select>` : ''}
                ${!responsaveis.length || digitarResp ? `<input data-orc="responsavel" value="${esc(orc.responsavel)}" placeholder="${responsaveis.length ? 'Digite o nome' : 'Quem está orçando'}"${responsaveis.length ? ' style="margin-top:6px"' : ''}>` : ''}</label>
            </div>
            <datalist id="tipos">${tipos.map((t) => `<option value="${esc(t)}">`).join('')}</datalist>
            <datalist id="lista-clientes">${db.clientes.map((c) => `<option value="${esc(c.nome)}">`).join('')}</datalist>
          </div>

          <div class="card ia-painel">
            <div class="card-titulo"><h2>${icone('brilho')}Briefing e sugestão da IA</h2></div>
            <label class="campo">Descreva o job como o cliente pediu — o quê, quando, onde, quantas pessoas, entregas e prazo
              <textarea data-orc="briefing" rows="4" placeholder="Ex.: Evento corporativo de 1 dia inteiro em Piracicaba, ~200 pessoas, palestras no palco. Querem fotos tratadas, um after movie de 1min30 e 3 reels para o Instagram. Entrega em 7 dias.">${esc(orc.briefing)}</textarea></label>
            <div class="adicionar" style="align-items:center">
              <button class="btn ia" data-acao="ia" id="btn-ia">${icone('brilho')}Sugerir orçamento com IA</button>
              <span class="small muted">${iaConfigurada ? 'A IA sugere os serviços (usando o catálogo, a base de conhecimento e os orçamentos anteriores) e preenche nome, tipo, local e data que estiverem em branco.' : 'A IA ainda não está configurada — <a href="#/config">configurar</a>.'}</span>
            </div>
            <div id="ia-res">${sugestaoHTML()}</div>
          </div>

          <div class="card">
            <div class="card-titulo"><h2>${icone('claquete')}Serviços</h2><span class="muted small" id="n-itens">${orc.itens.length} item(ns) · ${t.horas} horas-pessoa</span></div>
            ${orc.itens.length ? `
              <div class="item-cab"><div>Serviço</div><div>Qtd</div><div>Pré p×h</div><div>Prod p×h</div><div>Pós p×h</div><div>Total</div><div></div></div>
              <div class="itens">${orc.itens.map((it) => itemHTML(it, t.porItem[it.uid])).join('')}</div>`
            : `<div class="vazio" style="padding:20px">${icone('claquete')}<div>Nenhum serviço ainda. Adicione do catálogo ou peça uma sugestão à IA.</div></div>`}
            <div class="adicionar">
              <button class="btn primario" data-acao="add-servico">${icone('mais')}Adicionar serviço</button>
              <button class="btn" data-acao="add-livre">${icone('mais')}Item personalizado</button>
            </div>
          </div>

          ${equipeHTML(t)}

          <div class="card">
            <div class="grade g2">
              <label class="campo">Observações para o cliente (aparecem na proposta)<textarea data-orc="observacoes" rows="3">${esc(orc.observacoes)}</textarea></label>
              <label class="campo">Notas internas (não aparecem na proposta)<textarea data-orc="notas_internas" rows="3">${esc(orc.notas_internas)}</textarea></label>
            </div>
          </div>
        </div>
        <aside class="lateral" id="lateral">${lateralHTML(t)}</aside>
      </div>`;
    atualizarNumeros();
  };

  /** Atualiza só os números (sem redesenhar a tela, para não perder o foco do campo). */
  const atualizarNumeros = () => {
    const t = calcOrcamento(orc, cfg, db.pessoas);
    const $ = (s) => el.querySelector(s);
    for (const it of orc.itens) {
      const c = t.porItem[it.uid];
      const tot = $(`[data-total="${it.uid}"]`);
      if (tot) tot.textContent = brl(c.total);
      const q = $(`[data-quebra="${it.uid}"]`);
      if (q) q.innerHTML = quebraHTML(c);
    }
    for (const k of ['pre', 'prod', 'pos', 'log', 'total', 'eco', 'final', 'custo']) {
      const v = { eco: t.economia, custo: t.custoEquipe }[k] ?? t[k];
      const s = $(`#r-${k}`);
      if (s) s.textContent = brl(v);
    }
    const res = $('#r-res');
    if (res) {
      const pct = t.final ? Math.round((100 * t.resultado) / t.final) : 0;
      res.innerHTML = t.custoEquipe ? `<b style="color:${t.resultado >= 0 ? 'var(--ok)' : 'var(--bad)'}">${brl(t.resultado)}</b> <span class="faint">(${pct}%)</span>` : '<span class="faint">escale a equipe</span>';
    }
    const barra = $('#r-barra');
    if (barra) {
      const cores = { pre: 'var(--etapa-pre)', prod: 'var(--etapa-prod)', pos: 'var(--etapa-pos)', log: 'var(--warn)' };
      barra.innerHTML = t.total ? Object.entries(cores).map(([k, c]) => `<i style="width:${(100 * t[k]) / t.total}%;background:${c}"></i>`).join('') : '';
    }
    el.querySelectorAll('.descontos button').forEach((b) => b.classList.toggle('ativo', num(b.dataset.v) === num(orc.desconto)));
    const eqt = $('#eq-total');
    if (eqt) eqt.textContent = brl(t.custoEquipe);
    const ni = $('#n-itens');
    if (ni) ni.textContent = `${orc.itens.length} item(ns) · ${t.horas} horas-pessoa`;
    for (const a of orc.equipe) {
      const inp = $(`[data-eq="${a.uid}"][data-f="valor"]`);
      if (inp) inp.placeholder = brl(custoAlocacao({ ...a, valor: '' }, db.pessoas, cfg));
    }
  };

  // ---------------------------------------------------------- modais
  const abrirCatalogo = () => {
    let filtro = '';
    let etapa = '';
    let adicionou = false;
    modal({
      titulo: 'Adicionar serviço do catálogo',
      largo: true,
      aoFechar: () => { if (adicionou) render(); },
      corpo: `
        <div class="filtros" style="margin:0">
          <input type="search" id="cq" placeholder="Buscar serviço…">
          <div class="segmentado" id="ce">
            <button data-e="" class="ativo">Todos</button>${ETAPAS.map((e) => `<button data-e="${e.chave}">${e.nome}</button>`).join('')}
          </div>
        </div>
        <div class="picker-lista" id="cl"></div>`,
      rodape: `<span class="small muted">Clique para adicionar. Pode adicionar vários.</span><button class="btn primario" data-ok>Concluir</button>`,
      aoMontar: (m, fechar) => {
        const lista = m.querySelector('#cl');
        const desenhar = () => {
          const q = filtro.toLowerCase();
          const itens = db.servicos
            .filter((s) => s.ativo !== false && (!etapa || s.etapa === etapa) && (!q || (s.nome + ' ' + s.obs).toLowerCase().includes(q)))
            .sort((a, b) => (ORDEM[a.etapa] - ORDEM[b.etapa]) || a.nome.localeCompare(b.nome));
          lista.innerHTML = itens.map((s) => `
            <div class="picker-item" data-id="${s.id}">
              <span class="etapa ${s.etapa}" style="justify-self:start">${curtoEtapa(s.etapa)}</span>
              <div style="min-width:0"><b>${esc(s.nome)}</b><div class="small muted">${esc(s.obs)}</div></div>
              <b class="num">${brl(calcItem(itemDeServico(s), orc, cfg).total)}</b>
            </div>`).join('') || '<div class="vazio">Nada encontrado.</div>';
        };
        m.querySelector('#cq').oninput = (e) => { filtro = e.target.value; desenhar(); };
        m.querySelectorAll('#ce button').forEach((b) => {
          b.onclick = () => { etapa = b.dataset.e; m.querySelectorAll('#ce button').forEach((x) => x.classList.toggle('ativo', x === b)); desenhar(); };
        });
        lista.onclick = (e) => {
          const alvo = e.target.closest('.picker-item');
          if (!alvo) return;
          orc.itens.push(itemDeServico(buscarServico(alvo.dataset.id)));
          adicionou = true;
          alvo.style.borderColor = 'var(--ok)';
          alvo.querySelector('b.num').textContent = '✓ adicionado';
          mudou();
        };
        m.querySelector('[data-ok]').onclick = fechar;
        desenhar();
      },
    });
  };

  const abrirEscalar = (funcaoInicial = '') => {
    let q = '';
    let funcao = funcaoInicial;
    const funcoes = [...new Set(todasFuncoes().concat(funcoesNecessarias().map(([f]) => f)))].sort((a, b) => a.localeCompare(b));
    // Sugere etapa e horas a partir dos serviços que pedem essa função.
    const sugerir = (fn) => {
      const it = orc.itens.find((i) => (i.funcoes || []).includes(fn));
      const etapa = it ? (['prod', 'pos', 'pre'].find((e) => num(it[e]?.p) > 0) || it.etapa) : 'prod';
      return { etapa, horas: it ? num(it[etapa]?.h) * num(it.qtd, 1) : 8 };
    };
    const adicionar = (pessoaId, fn) => {
      orc.equipe.push({ uid: uid('eq'), pessoa_id: pessoaId, funcao: fn, ...sugerir(fn), valor: '' });
      mudou();
    };
    modal({
      titulo: funcaoInicial ? `Escalar: ${funcaoInicial}` : 'Escalar equipe',
      largo: true,
      corpo: `
        <div class="picker-item" data-interno style="grid-template-columns:40px minmax(0,1fr) auto;border-color:var(--accent)">
          <div class="avatar">CF</div>
          <div><b>Equipe Chiaro (interna)</b><div class="small muted">Adiciona horas da equipe da casa${funcao ? ` como ${esc(funcao)}` : ''} · ${num(cfg.custo_hora_equipe) ? brl(cfg.custo_hora_equipe) + '/h' : 'custo-hora ainda não definido'}</div></div>
          <span class="chip roxo">interna</span>
        </div>
        <div class="filtros" style="margin:14px 0 0">
          <input type="search" id="pq" placeholder="Buscar freela…" style="max-width:220px">
          <select id="pf" style="width:auto"><option value="">Todas as funções</option>${funcoes.map((f) => `<option ${f === funcao ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select>
        </div>
        ${orc.data_evento ? '' : '<p class="small muted" style="margin:10px 0 0">Dica: preencha a data do job para ver quem já está ocupado nesse dia.</p>'}
        <div class="picker-lista" id="pl"></div>`,
      rodape: `<a href="#/pessoas" class="small">Cadastrar freela novo →</a><button class="btn" data-ok>Fechar</button>`,
      aoMontar: (m, fechar) => {
        const lista = m.querySelector('#pl');
        const desenhar = () => {
          const qq = q.toLowerCase();
          const pessoas = db.pessoas
            .filter((p) => p.ativo !== false && (!funcao || (p.funcoes || []).includes(funcao)) && (!qq || p.nome.toLowerCase().includes(qq)))
            .sort((a, b) => num(b.avaliacao) - num(a.avaliacao) || a.nome.localeCompare(b.nome));
          lista.innerHTML = pessoas.map((p) => {
            const conf = conflitos(p.id, orc);
            const ja = orc.equipe.some((a) => a.pessoa_id === p.id);
            return `
              <div class="picker-item" data-id="${p.id}" style="grid-template-columns:40px minmax(0,1fr) auto">
                <div class="avatar freela">${esc(iniciais(p.nome))}</div>

      <tbody id="corpo"></tbody></table></div>
    <p class="small faint">Preço unitário = pessoas × horas × hora técnica × multiplicador × complexidade + depreciação + margem, arredondado para a dezena (mesma conta da planilha).</p>`;

  const corpo = el.querySelector('#corpo');

    const q = busca.toLowerCase();

async function salvarPendente() {
  // Algumas telas (o editor, a proposta comercial) precisam salvar antes de sair.
  if (saida.fn) { try { await saida.fn(); } catch (e) { console.error(e); } saida.fn = null; }
}

/** Botão "Atualizar": salva o que está aberto, relê os dados do disco (inclusive o que outras pessoas
 *  gravaram na pasta compartilhada) e redesenha a tela atual, mantendo a posição da rolagem. */
let atualizando = false;
async function atualizar() {
  if (atualizando) return;
  atualizando = true;
  const y = window.scrollY;
  document.querySelectorAll('[data-atualizar]').forEach((b) => b.classList.add('girando'));
  try {
    await salvarPendente();
    await carregarTudo(true);
    await rotear({ manterRolagem: true });
    window.scrollTo(0, y);
    toast('Dados atualizados.');
  } catch (e) {
    toast('Não consegui atualizar: ' + e.message, true);
  } finally {
    atualizando = false;
  }
}

async function rotear({ manterRolagem = false } = {}) {
  await salvarPendente();
  document.querySelectorAll('.modal-fundo').forEach((m) => m.remove());
  document.title = 'Chiaro Orçamentos';
  const h = location.hash || '#/';
  const partes = h.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (!manterRolagem) window.scrollTo(0, 0);

  if (partes[0] === 'orcamento' && partes[2] === 'proposta') {
    raiz.innerHTML = '';
    return telaProposta(raiz, partes[1]);
  }
  if (partes[0] === 'orcamento' && partes[2] === 'comercial') {
    // contêiner novo a cada abertura: os eventos de teclado da tela anterior somem junto com ele
    raiz.innerHTML = '<div></div>';
    return telaComercial(raiz.firstChild, partes[1]);
  }
  const el = casca();
  try {
    if (partes[0] === 'orcamento') return await telaEditor(el, partes[1]);
    if (partes[0] === 'dashboard') return telaDashboard(el);
    if (partes[0] === 'clientes') return telaClientes(el, partes[1]);
    if (partes[0] === 'servicos') return telaServicos(el);
    if (partes[0] === 'pessoas') return telaPessoas(el);
    if (partes[0] === 'usuarios') return await telaUsuarios(el);
    if (partes[0] === 'config') return await telaConfig(el);
    return telaOrcamentos(el);
  } catch (e) {
    console.error(e);
    el.innerHTML = `<div class="card"><h2>Algo deu errado</h2><p class="muted">${esc(e.message)}</p></div>`;
  }
}

async function iniciar() {
  await garantirLogin(raiz);
  try {
    telaCarregando(raiz);
    await carregarTudo();
    await esperarAbertura();
    versao = VERSAO_GAS;
  } catch (e) {
    raiz.innerHTML = `<div class="main"><div class="card"><h2>Não consegui falar com o servidor</h2>
      <p class="muted">${esc(e.message)} Recarregue a página para tentar de novo.</p></div></div>`;
    return;
  }
  window.addEventListener('hashchange', () => rotear());
  // qualquer elemento com data-atualizar (menu lateral, barras das telas de proposta) dispara a atualização
  document.addEventListener('click', (e) => {
    if (!e.target.closest('[data-atualizar]')) return;
    e.preventDefault();
    atualizar();
  });
  document.addEventListener('click', (e) => { if (e.target.closest('[data-sair]')) { e.preventDefault(); sair(); } });
  window.addEventListener('beforeunload', () => { saida.fn?.(); });
  window.addEventListener('unhandledrejection', (e) => toast(e.reason?.message || 'Erro inesperado', true));
  rotear();
}

iniciar();

return {  };
})();
</script>
